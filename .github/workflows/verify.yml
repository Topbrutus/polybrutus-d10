name: Verify Polybrutus D10 certificate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact mathematics
        run: python -m pip install sympy==1.14.0
      - name: Verify D10 Euclidean rank and Laplacian spectrum
        run: python src/verify_d10.py
      - name: Verify D10 independently from rational distance rules
        run: python tests/independent_d10.py
